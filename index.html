<title>Project Rundown Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/shell.css">
<link rel="stylesheet" href="styles/sidebar.css">
<link rel="stylesheet" href="styles/header.css">
<link rel="stylesheet" href="styles/toolbar.css">
<link rel="stylesheet" href="styles/list.css">
<link rel="stylesheet" href="styles/assistant.css">
<link rel="stylesheet" href="styles/states.css">
<link rel="stylesheet" href="styles/mobile.css">
<link rel="modulepreload" href="dist/main.js">

<div class="shell" id="shell">
  <aside class="rail" aria-label="Navigation">
    <rd-sidebar>
      <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M2 12h20M12 6v12" stroke="currentColor" stroke-width="2.2"/></svg><span class="brand-name">Rundown</span><button class="rtoggle" type="button" data-ref="slim" aria-pressed="false" aria-controls="shell" aria-label="Collapse sidebar" data-tip="Expand sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg></button></div>
      <nav class="navs" data-ref="nav" aria-label="Filter projects"></nav>
      <button class="sec" type="button" data-ref="sec" aria-expanded="true" aria-controls="area-nav">Areas <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 7.5 3-3 3 3"/></svg></button>
      <nav class="area-nav" id="area-nav" data-ref="areas" aria-label="Filter by area"></nav>
      <section class="me" aria-label="Your check-ins">
        <div class="me-row"><span class="av" aria-hidden="true" data-ref="initials">R</span><span><b data-ref="owner">Rundown</b><small data-ref="run">No schedule yet</small></span><rd-settings><button class="mset" type="button" data-ref="btn" popovertarget="me-settings" aria-expanded="false" aria-label="Settings" data-tip="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button><div class="fpop mpop" id="me-settings" data-ref="pop" popover="auto" role="dialog" aria-label="Settings"></div></rd-settings></div>
      </section>
    </rd-sidebar>
  </aside>

  <main class="center" aria-labelledby="p-h">
    <header class="phead">
      <div class="ptitle"><h1 id="p-h">Projects</h1><rd-count class="count num" aria-label="Projects shown">0</rd-count></div>
      <div class="pactions">
        <button class="cta" type="button" id="copy-cmd-2" title="Copy /project-checkin" aria-label="Copy /project-checkin command"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3M12.5 15H17"/></svg><span class="cta-lbl">/project-checkin</span></button>
        <rd-focus hidden><button class="ftoggle" type="button" data-ref="btn" aria-pressed="false" aria-label="Enter focus mode" title="Focus mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fon" d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/><path class="foff" d="M9 4v4a1 1 0 0 1-1 1H4M20 9h-4a1 1 0 0 1-1-1V4M15 20v-4a1 1 0 0 1 1-1h4M4 15h4a1 1 0 0 1 1 1v4"/></svg></button></rd-focus>
        <button class="atoggle" type="button" id="agent-toggle" aria-controls="agent" aria-expanded="false" aria-label="Open assistant" title="Ask Rundown"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.6 4.8 2.4 7.4 10 10-7.6 2.6-9.4 5.2-10 10-.6-4.8-2.4-7.4-10-10 7.6-2.6 9.4-5.2 10-10z"/></svg></button>
      </div>
    </header>
    <div class="pmeta">
      <rd-stat-strip class="pstats" role="group" aria-label="Project summary"><span class="pstats-msg" data-ref="msg">Loading your projects…</span></rd-stat-strip>
      <rd-streak class="streak" data-tier="0" role="img" aria-label="No streak yet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.3 2.2-5.4 3.8-7.3.4 1.8 1.4 3 2.6 3.5-.3-2.7.7-5.6 3.1-8 .4 3 1.6 4.8 2.8 6.5 1 1.4 1.7 3 1.7 5.1 0 3.7-2.6 6.4-6.5 6.4z"/><path d="M12 21c-1.6 0-2.8-1.2-2.8-2.9 0-1.5 1-2.6 2.8-4.3 1.8 1.7 2.8 2.8 2.8 4.3 0 1.7-1.2 2.9-2.8 2.9z"/></svg><b class="num" data-ref="n">0</b><span>day streak</span></rd-streak>
    </div>
    <section class="ptable" aria-label="Project list">
      <rd-toolbar class="ptools">
        <label class="psearch"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span class="sr">Search projects</span><input data-ref="q" type="search" placeholder="Search" autocomplete="off"></label>
        <span class="tsep" aria-hidden="true"></span>
        <div class="pfilters" data-ref="chips" role="group" aria-label="Filter projects"></div>
        <div class="tright">
          <button class="fclear" type="button" data-ref="clear" hidden>Clear</button>
          <label class="fsort"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M3.5 16.5 7 20l3.5-3.5M13 6h8M13 11h6M13 16h4"/></svg><span class="sr">Sort projects</span><select data-ref="sort"></select><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></label>
          <button class="fbtn" type="button" data-ref="fbtn" aria-haspopup="dialog" aria-controls="fsheet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filters<span class="badge num" data-ref="fbadge" hidden></span></button>
        </div>
        <dialog class="fsheet" id="fsheet" data-ref="sheet" aria-labelledby="fsheet-h">
          <header class="fsh"><h2 id="fsheet-h">Filter &amp; sort</h2><button class="ibtn" type="button" data-ref="sheet-x" aria-label="Close filters"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 3 6 6M9 3 3 9"/></svg></button></header>
          <div class="fgroups" data-ref="groups"></div>
          <footer class="fsf"><button class="fclear" type="button" data-ref="sheet-clear">Clear filters</button><button class="cta" type="button" data-ref="sheet-done">Show results (<span class="num" data-ref="sheet-n">0</span>)</button></footer>
        </dialog>
      </rd-toolbar>
      <rd-note class="note" role="note" aria-labelledby="note-h" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        <p><strong id="note-h">Rundown note</strong> <span data-ref="text"></span></p>
        <button class="note-x" type="button" data-ref="dismiss" aria-label="Dismiss note"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 3 6 6M9 3 3 9"/></svg></button>
      </rd-note>
      <rd-status>
        <div class="note lstat" data-ref="band" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20zM12 10v4M12 17h.01"/></svg><p><strong data-ref="title"></strong> <span data-ref="text"></span></p><button class="fclear" type="button" data-ref="retry" data-fk="status:retry" hidden>Try again</button></div>
        <p class="sr" role="status" aria-live="polite" data-ref="live"></p>
      </rd-status>
      <rd-project-list><ul class="plist" data-ref="list" aria-label="Projects"></ul></rd-project-list>
      <rd-decisions hidden><ul class="plist" data-ref="list" aria-label="Open decisions, oldest first"></ul></rd-decisions>
    </section>
  </main>

  <rd-assistant>
    <div class="scrim" data-ref="scrim" aria-hidden="true"></div>
    <aside class="agent" id="agent" data-ref="panel" aria-labelledby="agent-h">
      <div class="aresize" data-ref="resize" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="agent" aria-label="Resize assistant panel" aria-valuemin="300" aria-valuemax="600" aria-valuenow="340"></div>
      <nav class="arail" aria-label="Assistant shortcuts">
        <button class="rbtn" type="button" data-ref="rail-open" aria-controls="agent" aria-label="Expand assistant panel" data-tip="Expand panel"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15M16 10l-2 2 2 2"/></svg></button>
        <hr>
        <div class="arail-grp" data-ref="rail-pri" role="group" aria-label="Top priorities"></div>
        <hr>
        <button class="rbtn" type="button" data-rq="What's blocked, and what would unblock each one?" aria-label="Ask: Blockers" data-tip="Blockers"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
        <button class="rbtn" type="button" data-rq="What should I do first this week, in order? Three items max." aria-label="Ask: This week" data-tip="This week"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></button>
        <button class="rbtn" type="button" data-rq="Which projects overlap or should be merged or dropped?" aria-label="Ask: Overlap" data-tip="Overlap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg></button>
        <button class="rbtn chat" type="button" data-ref="rail-chat" aria-label="Ask about your projects" data-tip="Ask Rundown"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg></button>
      </nav>
      <header class="agent-head"><h2 id="agent-h" data-ref="title" tabindex="-1">Ask Rundown</h2><button class="ibtn" type="button" data-ref="close-x" aria-label="Close assistant"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 3 6 6M9 3 3 9"/></svg></button></header>
      <rd-priorities>
        <section class="drawer" data-ref="section" aria-labelledby="pri-h">
          <div class="dhead">
            <h3 class="cards-lbl" id="pri-h">Top priorities</h3>
            <button class="ibtn flip" type="button" data-ref="toggle" aria-expanded="true" aria-controls="dbody" aria-label="Collapse top priorities"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 7.5 3-3 3 3"/></svg></button>
            <button class="ibtn aclose" type="button" data-ref="collapse" aria-controls="agent" aria-label="Collapse assistant panel" title="Collapse panel"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M14.5 4.5v15M8 10l2 2-2 2"/></svg></button>
          </div>
          <div class="dbody" id="dbody" data-ref="body"><div class="cards" data-ref="cards" role="group" aria-label="Top three priorities"></div></div>
        </section>
        <div class="handle" data-ref="handle" role="separator" tabindex="0" aria-orientation="horizontal" aria-controls="dbody" aria-label="Resize top priorities. Drag up to collapse." aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"></div>
      </rd-priorities>
      <rd-composer>
        <div class="ascroll" data-ref="scroll">
          <div class="ahead" data-ref="head" hidden><span>Kept until you close this tab</span><button class="aclear" type="button" data-ref="clear">Clear</button></div>
          <div class="alog" data-ref="log" role="log" aria-label="Ask Rundown answers" aria-live="polite"></div>
        </div>
        <form class="composer" data-ref="form">
          <label><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.6 4.8 2.4 7.4 10 10-7.6 2.6-9.4 5.2-10 10-.6-4.8-2.4-7.4-10-10 7.6-2.6 9.4-5.2 10-10z"/></svg><span class="sr">Ask about your projects</span><textarea data-ref="input" rows="2" placeholder="Ask about your projects…" autocomplete="off" aria-describedby="ask-hint"></textarea><span class="sr" id="ask-hint">Enter to send, Shift+Enter for a new line.</span></label>
          <div class="crow">
            <button class="chip" type="button" data-q="What's blocked, and what would unblock each one?"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Blockers</button>
            <button class="chip" type="button" data-q="What should I do first this week, in order? Three items max."><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>This week</button>
            <button class="chip" type="button" data-q="Which projects overlap or should be merged or dropped?"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg>Overlap</button>
            <button class="send" type="submit" aria-label="Ask"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          </div>
        </form>
      </rd-composer>
    </aside>
  </rd-assistant>
</div>

<script type="module" src="dist/main.js"></script>
