# Fails when the board copies the Rundown plugin publishes (plugin/skills/{setup,update}/assets/board) differ from a fresh build.
# main only takes changes through PRs, so a bot can't sync it after merge: run `npm run plugin` in the PR.
name: Plugin board

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save typescript@5
      - run: npm run build
      - run: npm run plugin:check
